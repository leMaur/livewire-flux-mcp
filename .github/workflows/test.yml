name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in flight.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail on a known advisory (moderate or worse) in what actually ships:
      # the runtime dependency tree, not the dev tooling.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run tests
        run: npm test
