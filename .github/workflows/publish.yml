name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publishing
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Ensure npm supports OIDC trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1; pin to latest
        # to be robust against GHA runner image drift.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Get latest tag
        id: get-latest-tag
        run: |
          # fetch tags if not present
          git fetch --prune --tags --no-recurse-submodules
          TAG=$(git describe --tags --abbrev=0)
          # strip leading 'v' if present
          TAG=${TAG#v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Update package version
        run: npm version ${{ steps.get-latest-tag.outputs.version }} --no-git-tag-version

      - name: Publish package
        run: npm publish --provenance --access public
