name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publishing
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6 (resolved 2026-05-20)
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6 (resolved 2026-05-20)
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Ensure npm supports OIDC trusted publishing
        # OIDC trusted publishing requires npm >= 11.5.1; pin to latest
        # to be robust against GHA runner image drift.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Get latest tag
        id: get-latest-tag
        run: |
          # fetch tags if not present
          git fetch --prune --tags --no-recurse-submodules
          TAG=$(git describe --tags --abbrev=0)
          # strip leading 'v' if present
          TAG=${TAG#v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Update package version
        # Idempotent: if package.json already matches the tag (e.g. a contributor
        # pre-bumped it in a PR), skip the npm-version call — `npm version $X`
        # exits 1 with "Version not changed" when X equals the current value,
        # which previously broke the publish gate on the v2.3.0 release.
        # See CHANGELOG entry for 2.3.1 for the incident.
        run: |
          set -u
          TARGET="${{ steps.get-latest-tag.outputs.version }}"
          TARGET="${TARGET#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$TARGET" ]; then
            echo "package.json already at $TARGET — skipping npm version"
          else
            echo "Bumping package.json from $CURRENT to $TARGET"
            npm version "$TARGET" --no-git-tag-version
          fi

      - name: Publish package
        run: npm publish --provenance --access public
