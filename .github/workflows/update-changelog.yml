name: "Update Changelog"

on:
  release:
    types: [released]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6 (resolved 2026-05-20)
        with:
          ref: main

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1 (resolved 2026-05-20)
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7 (resolved 2026-05-20)
        with:
          commit-message: "docs: update CHANGELOG for ${{ github.event.release.tag_name }}"
          title: "docs: update CHANGELOG for ${{ github.event.release.tag_name }}"
          body: |
            Automated CHANGELOG update for release [`${{ github.event.release.tag_name }}`](${{ github.event.release.html_url }}).

            Generated by `.github/workflows/update-changelog.yml`. Direct push to `main` is blocked by branch protection, so this PR is opened instead.
          branch: chore/changelog-${{ github.event.release.tag_name }}
          base: main
          delete-branch: true
          add-paths: CHANGELOG.md
